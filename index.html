<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sha Design Studio — Designing playful, thoughtful products. Industrial design for toys and baby products by Shiran Bar." />
    <meta name="theme-color" content="#e95a29" />
    <title>Sha Design Studio — Designing Playful Thoughtful Products</title>

    <!-- Canonical + social share metadata. Kept in the STATIC head (not injected
         client-side) because social scrapers don't run JS. Absolute URLs point
         at the production domain so scrapers fetch the image once live. -->
    <link rel="canonical" href="https://shadesignstudio.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sha Design Studio" />
    <meta property="og:url" content="https://shadesignstudio.com/" />
    <meta property="og:title" content="Sha Design Studio — Designing Playful Products" />
    <meta property="og:description" content="Shiran Bar — industrial designer for toys & baby products." />
    <meta property="og:image" content="https://shadesignstudio.com/sha-og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sha Design Studio — playful wordmark with Work, Services and About badges." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sha Design Studio — Designing Playful Products" />
    <meta name="twitter:description" content="Shiran Bar — industrial designer for toys & baby products." />
    <meta name="twitter:image" content="https://shadesignstudio.com/sha-og-image.jpg" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
